name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 17 is only for sdkmanager (setup-android); the new cmdline-tools refuse JDK 11
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # packages: '' = only accept licenses (the default 'tools' package no longer exists)
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      # JDK 11 is for the build itself (Android Gradle Plugin 7.2.1)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.5.1"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
